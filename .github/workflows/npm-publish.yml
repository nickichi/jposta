# This workflow will run tests using node and then publish a package to npm when a release is created
# Publishing uses npm Trusted Publishing (OIDC), so no npm token is stored in this repository.
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Publish NPM Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.4.8)'
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm audit signatures
      - run: npm test

  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: set-version
        run: |
          RELEASE_VERSION="${TAG:-${GITHUB_REF#refs/tags/}}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # remove the v from the tag
          if [ "${RELEASE_VERSION:0:1}" == "v" ]; then
              RELEASE_VERSION="${RELEASE_VERSION:1}"
          fi
          # check
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "The package version ($PACKAGE_VERSION) does not match the release tag ($RELEASE_VERSION)"
              exit 1
          fi
          # outputs version
          echo "VERSION=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}

  publish-npm:
    needs: [build, check-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: npm ci && npm run build
      - name: Publish to NPM Packages
        run: |
          if [[ "$VERSION" == *"beta"* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
